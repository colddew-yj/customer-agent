[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-agent"
version = "0.1.0"
description = "通用客服 agent (LangGraph + FastAPI)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "customer-agent contributors" }]
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "langchain>=0.3.7",
    "langchain-core>=0.3.21",
    "langchain-text-splitters>=0.3.2",
    "langgraph==0.3.34",
    "langchain-openai>=0.2.10",
    "langchain-anthropic>=0.3.1",
    "langchain-deepseek>=0.1.2",
    "langchain-ollama>=0.2.0",
    "langchain-community>=0.3.10",
    "chromadb>=0.5.20",
    "jieba>=0.42.1",
    "tiktoken>=0.8.0",
    "rank-bm25>=0.2.2",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.2", "FlagEmbedding>=1.2.9"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
customer-agent = "agent.cli:main"
customer-agent-ingest = "agent.knowledge.ingest:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]